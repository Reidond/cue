# Every push to main builds Cue.app and publishes it as a GitHub release, with the
# changes since the previous release as its notes. Versions are CFBundleShortVersionString
# from Resources/Info.plist plus a patch number: 2.0.0, 2.0.1, …
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, for the version and the changelog

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Version
        id: version
        run: |
          base=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          last=$(git tag -l "v$base.*" --sort=-v:refname | head -n 1)
          if [[ -n $last ]]; then patch=$((${last##*.} + 1)); else patch=0; fi
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CUE_VERSION: ${{ steps.version.outputs.version }}
          CUE_BUILD: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Package
        run: ditto -c -k --keepParent build/Cue.app "Cue-${{ steps.version.outputs.version }}.zip"

      - name: Release notes
        run: |
          {
            echo "## Changes"
            echo
            scripts/changelog.sh
            echo
            cat <<'NOTES'
          ## Install

          1. Download `Cue-${{ steps.version.outputs.version }}.zip`, unzip it and move **Cue.app** to Applications.
          2. This build is signed ad hoc and not notarized: the first time, right-click Cue.app › **Open**
             (or run `xattr -dr com.apple.quarantine /Applications/Cue.app`). macOS asks for the
             microphone and screen-audio permissions again after each update.
          3. Cue needs `brew install whisper-cpp` and a signed-in Claude Code; see the README.

          Requires macOS 26 or later on Apple silicon.
          NOTES
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "Cue-$VERSION.zip" --title "Cue $VERSION" \
            --notes-file notes.md --target "$GITHUB_SHA"
