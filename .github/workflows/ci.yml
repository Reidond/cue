# Checks the TypeScript, builds the apps and runs the end-to-end suite on every pull request (and only there). The Mac suite is split across
# four macOS runners (`run.ts --shard`). Cue for Windows is built and tested in parallel jobs, each well under ten minutes: on x64 the app's
# cases, the installer's, and the backend's cases in three shards (they need no build); on arm64, where Node.js, workerd and Vite+ run emulated
# and three times slower, the app is built for Arm and its own cases run (the app's, the installer's), not the backend's, which the x64 jobs
# cover. `build-and-test`, the check main requires, passes when the check, every shard and every Windows job did.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: latest
          cache: true

      - name: Worker toolchain (cf must build with Vite+)
        run: node apps/api/scripts/check-vite.ts

      - name: Worker types
        working-directory: apps/api
        run: ./node_modules/.bin/cf workers types

      - name: Check (format, lint, types)
        run: vp check

  e2e:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one run reports every failing case.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: apps/mac
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log
          # New code must build warning-free (dependencies' warnings are theirs).
          if grep -E "Sources/Cue/.*: warning:" build.log; then echo "::error::Cue has build warnings"; exit 1; fi

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: latest
          cache: true

      - name: Worker types
        working-directory: apps/api
        run: ./node_modules/.bin/cf workers types

      - name: End-to-end tests
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: node tests/e2e/run.ts --no-build --shard=${{ matrix.shard }}/4

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          # Logs, session logs and snapshots only, not the sandboxes.
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*/cue.out
            ${{ runner.temp }}/e2e/*/*.txt
            ${{ runner.temp }}/e2e/*/backend.log
            ${{ runner.temp }}/e2e/*/claude/*
            ${{ runner.temp }}/e2e/*/*.png
            ${{ runner.temp }}/e2e/*/crash.ips
            ${{ runner.temp }}/e2e/*/home/Application Support/Cue/sessions/*.md
          if-no-files-found: ignore

      - name: Keep the app
        if: always() && matrix.shard == 1
        run: if [[ -d apps/mac/build/Cue.app ]]; then ditto -c -k --keepParent apps/mac/build/Cue.app Cue.zip; fi

      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 1
        with:
          name: Cue
          path: Cue.zip
          if-no-files-found: ignore

  windows:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `kind`: app builds Cue.exe and runs the w0 cases; installer also builds the MSI and runs w1; backend builds nothing and runs the
          # cases that never launch the app (`run.ts --no-app`), split by `--shard` from durations.json.
          - { id: x64-app, runner: windows-latest, arch: x64, kind: app, cases: 'w0-' }
          - { id: x64-installer, runner: windows-latest, arch: x64, kind: installer, cases: 'w1-' }
          - { id: x64-backend-1, runner: windows-latest, arch: x64, kind: backend, cases: '--no-app --shard=1/3' }
          - { id: x64-backend-2, runner: windows-latest, arch: x64, kind: backend, cases: '--no-app --shard=2/3' }
          - { id: x64-backend-3, runner: windows-latest, arch: x64, kind: backend, cases: '--no-app --shard=3/3' }
          - { id: arm64-app, runner: windows-11-arm, arch: arm64, kind: app, cases: 'w0-' }
          - { id: arm64-installer, runner: windows-11-arm, arch: arm64, kind: installer, cases: 'w1-' }
    name: windows (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: matrix.kind != 'backend'
        with:
          dotnet-version: 10.0.x

      # Node.js is the x64 build on both: the backend's workerd and Vite+'s native packages exist for x64 only, and Windows for Arm runs them.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: x64

      - name: NuGet cache
        if: matrix.kind != 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/windows/**/*.csproj', 'apps/windows/**/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.arch }}-

      - name: Toolchain
        run: powershell -ExecutionPolicy Bypass -File apps/windows/scripts/setup.ps1 -Install ${{ matrix.kind == 'backend' && '-Backend' || '' }}

      - name: Build the app
        if: matrix.kind == 'app'
        run: powershell -ExecutionPolicy Bypass -File apps/windows/scripts/build.ps1 -Arch ${{ matrix.arch }}

      - name: Build the app and the installer
        if: matrix.kind == 'installer'
        run: powershell -ExecutionPolicy Bypass -File apps/windows/scripts/build.ps1 -Arch ${{ matrix.arch }} -Msi

      - name: Worker types
        working-directory: apps/api
        run: node node_modules/cf/bin/cf workers types

      - name: End-to-end tests
        env:
          E2E_WORK: ${{ runner.temp }}\e2e
        run: node tests/e2e/run.ts --no-build ${{ matrix.cases }}

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-windows-${{ matrix.id }}
          # Logs, session logs and snapshots only, not the sandboxes.
          path: |
            ${{ runner.temp }}\e2e\*.log
            ${{ runner.temp }}\e2e\*\cue.out
            ${{ runner.temp }}\e2e\*\*.txt
            ${{ runner.temp }}\e2e\*\backend.log
            ${{ runner.temp }}\e2e\*\*.png
            ${{ runner.temp }}\e2e\*\*.html
            ${{ runner.temp }}\e2e\*\home\Application Support\Cue\sessions\*.md
            ${{ runner.temp }}\e2e\*\home\Application Support\Cue\crash.log
          if-no-files-found: ignore

      - name: Keep the installer
        if: matrix.kind == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: Cue-windows-${{ matrix.arch }}
          path: apps/windows/build/Cue-*.msi
          if-no-files-found: error

  build-and-test:
    needs: [check, e2e, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The check, every shard and the Windows jobs passed
        run: |
          echo "check: ${{ needs.check.result }}, e2e: ${{ needs.e2e.result }}, windows: ${{ needs.windows.result }}"
          [[ "${{ needs.check.result }}" == success && "${{ needs.e2e.result }}" == success && "${{ needs.windows.result }}" == success ]]
