# Checks the TypeScript, builds the app and runs the end-to-end suite on every pull request (and only there). The suite is split across
# four macOS runners (`run.ts --shard`); `build-and-test`, the check main requires, passes when the check and every shard did.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: latest
          cache: true

      - name: Worker toolchain (cf must build with Vite+)
        run: node apps/api/scripts/check-vite.ts

      - name: Worker types
        working-directory: apps/api
        run: ./node_modules/.bin/cf workers types

      - name: Check (format, lint, types)
        run: vp check

  e2e:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one run reports every failing case.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: apps/mac
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log
          # New code must build warning-free (dependencies' warnings are theirs).
          if grep -E "Sources/Cue/.*: warning:" build.log; then echo "::error::Cue has build warnings"; exit 1; fi

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: latest
          cache: true

      - name: Worker types
        working-directory: apps/api
        run: ./node_modules/.bin/cf workers types

      - name: End-to-end tests
        env:
          E2E_WORK: ${{ runner.temp }}/e2e
        run: node tests/e2e/run.ts --no-build --shard=${{ matrix.shard }}/4

      - name: Crash reports and the system log
        if: failure()
        run: |
          # ReportCrash may write a report after the case gave up waiting for it; the system log says what it did.
          mkdir -p "$RUNNER_TEMP/e2e/system"
          cp ~/Library/Logs/DiagnosticReports/Cue* /Library/Logs/DiagnosticReports/Cue* "$RUNNER_TEMP/e2e/system/" 2>/dev/null || true
          log show --last 60m --style compact --predicate '(process == "Cue" AND (messageType == error OR messageType == fault)) OR process == "ReportCrash" OR process == "osanalyticshelper"' > "$RUNNER_TEMP/e2e/system/log.txt" || true

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          # Logs, session logs and snapshots only, not the sandboxes.
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*/cue.out
            ${{ runner.temp }}/e2e/*/*.txt
            ${{ runner.temp }}/e2e/*/backend.log
            ${{ runner.temp }}/e2e/*/claude/*
            ${{ runner.temp }}/e2e/*/*.png
            ${{ runner.temp }}/e2e/*/crash.ips
            ${{ runner.temp }}/e2e/*/home/Application Support/Cue/sessions/*.md
            ${{ runner.temp }}/e2e/system/*
          if-no-files-found: ignore

      - name: Keep the app
        if: always() && matrix.shard == 1
        run: if [[ -d apps/mac/build/Cue.app ]]; then ditto -c -k --keepParent apps/mac/build/Cue.app Cue.zip; fi

      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 1
        with:
          name: Cue
          path: Cue.zip
          if-no-files-found: ignore

  build-and-test:
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The check and every shard passed
        run: |
          echo "check: ${{ needs.check.result }}, e2e: ${{ needs.e2e.result }}"
          [[ "${{ needs.check.result }}" == success && "${{ needs.e2e.result }}" == success ]]
