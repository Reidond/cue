# Checks the code on every pull request (and only there): the TypeScript (format, lint, types), and that both apps build without warnings,
# Cue.app on macOS and Cue for Windows with its installer for both processors. The end-to-end cases don't run here: they run in the Cue VMs,
# one run at a time (tests/e2e/remote.ts; AGENTS.md › Where work runs). `build-and-test`, the check main requires, passes when every job did.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: latest
          cache: true

      - name: Worker toolchain (cf must build with Vite+)
        run: node apps/api/scripts/check-vite.ts

      - name: Worker types
        working-directory: apps/api
        run: ./node_modules/.bin/cf workers types

      - name: Check (format, lint, types)
        run: vp check

  mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: apps/mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: apps/mac
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log
          # New code must build warning-free (dependencies' warnings are theirs).
          if grep -E "Sources/Cue/.*: warning:" build.log; then echo "::error::Cue has build warnings"; exit 1; fi

  windows:
    # One x64 runner builds both, as release.yml does: the arm64 app and installer are cross-built (nothing is run). Warnings fail build.ps1.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the apps and the installers
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            ./apps/windows/scripts/build.ps1 -Arch $arch -Msi
          }

  build-and-test:
    needs: [check, mac, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The check and the builds passed
        run: |
          echo "check: ${{ needs.check.result }}, mac: ${{ needs.mac.result }}, windows: ${{ needs.windows.result }}"
          [[ "${{ needs.check.result }}" == success && "${{ needs.mac.result }}" == success && "${{ needs.windows.result }}" == success ]]
